[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostindex"
version = "1.0.0"
description = "Authorized Wayback Machine archive intelligence desk"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "PyJWT>=2.9.0",
  "bcrypt>=4.2.0",
  "python-multipart>=0.0.12",
  "httpx[socks]>=0.27.0",
  "apscheduler>=3.10.4",
  "jinja2>=3.1.4",
  "pillow>=11.0.0",
  "email-validator>=2.2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*", "static/**/*"]
